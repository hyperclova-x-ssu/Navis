<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">가짜 가게 자리도</title><desc id="desc">창가 2인 테이블 3개, 중앙 4인 테이블 2개, 바 4석. 테이블 6개와 총 18석, 가운데 통로, 왼쪽 아래 입구.</desc><rect width="1000" height="760" rx="10" fill="#FAFAFA"/><g fill="none" stroke="#71717A" stroke-width="2"><rect x="56" y="56" width="888" height="648" rx="8"/><path d="M94 100H906" stroke="#315E63" stroke-width="8"/><path d="M90 380H910" stroke="#E4E4E7" stroke-width="72"/><path d="M56 620V704H170" stroke="#FAFAFA" stroke-width="8"/></g><g fill="#FFFFFF" stroke="#71717A" stroke-width="2"><rect x="145" y="156" width="160" height="112" rx="8"/><rect x="420" y="156" width="160" height="112" rx="8"/><rect x="695" y="156" width="160" height="112" rx="8"/><rect x="170" y="484" width="220" height="136" rx="8"/><rect x="485" y="484" width="220" height="136" rx="8"/><rect x="830" y="462" width="70" height="202" rx="8"/></g><g font-family="-apple-system, Apple SD Gothic Neo, sans-serif" fill="#18181B" font-size="24" text-anchor="middle"><text x="500" y="92">창가 6석</text><text x="225" y="222">2석</text><text x="500" y="222">2석</text><text x="775" y="222">2석</text><text x="280" y="565">4석</text><text x="595" y="565">4석</text><text x="865" y="548">바</text><text x="865" y="582">4석</text><text x="500" y="389" fill="#52525B">가운데 통로</text><text x="110" y="674">입구</text></g></svg>