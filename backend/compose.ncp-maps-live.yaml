# Opt-in Marketing Maps Geocoding binding for local Compose.
services:
  marketing:
    environment:
      NAVIS_NCP_MAPS_PROVIDER: live
      NAVIS_NCP_SEARCH_STORE_ID: ${NAVIS_NCP_SEARCH_STORE_ID:-c05409a6-f082-5964-a787-c1ed3184988b}
      NAVIS_NCP_MAPS_STORE_ADDRESS: ${NAVIS_NCP_MAPS_STORE_ADDRESS:-서울 동작구 상도동 999-12}
    volumes:
      - type: bind
        source: ${HOME:?HOME is required}/.navis-ncp/secrets/NCP_MAPS_CLIENT_ID
        target: /run/navis-ncp/maps/NCP_MAPS_CLIENT_ID
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HOME:?HOME is required}/.navis-ncp/secrets/NCP_MAPS_CLIENT_SECRET
        target: /run/navis-ncp/maps/NCP_MAPS_CLIENT_SECRET
        read_only: true
        bind: {create_host_path: false}
    networks: [navis-live-egress]

networks:
  navis-live-egress: {}
