# 서비스별 Secret 예시 (샘플). 실제 값은 저장소에 두지 않고 배포 파이프라인에서 주입합니다.
# 각 키는 컨테이너의 /run/secrets/<키> 파일로 마운트됩니다.
apiVersion: v1
kind: Secret
metadata:
  name: navis-account
type: Opaque
stringData:
  account_runtime_password: "{sample: account DB 런타임 비밀번호, 해당 값은 예시입니다}"
  account_signing_key.pem: "{sample: ES256 개인키(PEM), 해당 값은 예시입니다}"
  gateway_account_token: "{sample: gateway → account 내부 토큰, 해당 값은 예시입니다}"
---
apiVersion: v1
kind: Secret
metadata:
  name: navis-pos
type: Opaque
stringData:
  pos_runtime_password: "{sample: pos DB 런타임 비밀번호, 해당 값은 예시입니다}"
  gateway_pos_token: "{sample: gateway → pos 내부 토큰, 해당 값은 예시입니다}"
  customer_pos_token: "{sample: customer → pos 내부 토큰, 해당 값은 예시입니다}"
  pos_redis_password: "{sample: Redis 비밀번호, 해당 값은 예시입니다}"
---
apiVersion: v1
kind: Secret
metadata:
  name: ncr-pull-secret
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"{sample: registry}":{"username":"{sample: NCP Access Key}","password":"{sample: NCP Secret Key}"}}}'
