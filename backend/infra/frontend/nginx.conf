log_format navis_frontend escape=json
  '{"service":"frontend","requestId":"$http_x_request_id","method":"$request_method","status":$status}';

server {
    listen 80;
    server_tokens off;
    access_log /dev/stdout navis_frontend;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type application/json;
        return 200 '{"service":"frontend","status":"ok"}';
    }

    location = /readyz {
        default_type application/json;
        if (!-f $document_root/index.html) { return 503 '{"service":"frontend","status":"unavailable"}'; }
        return 200 '{"service":"frontend","status":"ready"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
