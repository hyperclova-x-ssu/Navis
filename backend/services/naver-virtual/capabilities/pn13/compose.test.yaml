# Local contract proof. The tools image is the existing backend Dockerfile's tools target.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: naver_virtual
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, naver_virtual, -h, '127.0.0.1']
      interval: 1s
      timeout: 2s
      retries: 20
    networks: [proof]
  contracts:
    image: ${PN_P4_TOOLS_IMAGE:-navis-backend-local-tools:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_P4_TEST_DATABASE_URL: postgresql://postgres@postgres/naver_virtual
    command:
      - node
      - node_modules/vitest/vitest.mjs
      - run
      - services/naver-virtual/capabilities/pn13/group.test.ts
      - --maxWorkers=2
      - --testTimeout=30000
    volumes:
      - ../../:/app/backend/services/naver-virtual:ro
      - ../../../../packages/naver:/app/backend/packages/naver:ro
      - ../../../../packages/db:/app/backend/packages/db:ro
      - ../../../../../server/media:/app/server/media:ro
    networks: [proof]
networks:
  proof:
    internal: true
