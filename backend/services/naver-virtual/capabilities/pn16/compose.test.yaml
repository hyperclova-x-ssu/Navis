services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: naver_virtual
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -h, localhost, -U, postgres, -d, naver_virtual]
      interval: 1s
      timeout: 2s
      retries: 20
    networks: [proof]
  proof:
    image: navis-backend-local-tools:latest
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/backend
    entrypoint: [node, --experimental-transform-types, services/naver-virtual/capabilities/pn16/compose-test.mts]
    volumes:
      - ../../../../services/naver-virtual:/app/backend/services/naver-virtual:ro
      - ../../../../packages/naver:/app/backend/packages/naver:ro
      - ../../../../packages/db:/app/backend/packages/db:ro
      - ../../../../../db/seed:/app/db/seed:ro
      - ../../../../../src/data/db/generated:/app/src/data/db/generated:ro
    networks: [proof]
networks:
  proof:
    internal: true
