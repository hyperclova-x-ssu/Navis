      NAVIS_INSIGHT_INVENTORY_READ_TOKEN_FILE: /run/secrets/insight_inventory_read_token
      NAVIS_MARKETING_INVENTORY_TOKEN_FILE: /run/secrets/marketing_inventory_token
      NAVIS_POS_INVENTORY_TOKEN_FILE: /run/secrets/pos_inventory_token
      NAVIS_POS_FIXTURE_NOW: ${NAVIS_POS_FIXTURE_NOW:-}
      NAVIS_REDIS_URL: redis://redis:6379
    networks: [workloads, data, cache, naver-virtual-api]
    secrets:
      - inventory_run_password
      - insight_inventory_read_token
      - marketing_inventory_token
      - gateway_inventory_token
