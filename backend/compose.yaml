      NAVIS_INSIGHT_CUSTOMER_READ_TOKEN_FILE: /run/secrets/insight_customer_read_token
      NAVIS_MARKETING_CUSTOMER_READ_TOKEN_FILE: /run/secrets/marketing_customer_read_token
      NAVIS_MARKETING_CUSTOMER_TOKEN_FILE: /run/secrets/marketing_customer_token
      NAVIS_REDIS_URL: redis://redis:6379
    secrets:
