      NAVIS_FIXTURE_SMS_STATE_DIR: /var/lib/navis/fake-sens
      NAVIS_PROMO_SCENE_PROVIDER: ${NAVIS_PROMO_SCENE_PROVIDER:-claude}
      NAVIS_PROMO_FIXTURE_STAGE_INTERVAL_MS: ${NAVIS_PROMO_FIXTURE_STAGE_INTERVAL_MS:-250}
    secrets:
      - marketing_wrk_password
      - marketing_worker_redis_password
      - marketing_account_token
      - promo_insight_token
      - fixture_sms_key
      - nvirtual_marketing_worker_token
      - marketing_sms_worker_token
      - marketing_worker_inventory_token
      - nvirtual_alimtalk_id
      - nvirtual_alimtalk_key
      - nvirtual_alimtalk_service
      - nvirtual_brand_consent
      - nvirtual_brand_friends
      - nvirtual_brandmessage_id
      - nvirtual_brandmessage_key
      - nvirtual_brandmessage_service
      - nvirtual_mail_id
      - nvirtual_mail_key
      - nvirtual_mail_sender
      - nvirtual_mail_service
      - nvirtual_promo_storage_id
      - nvirtual_promo_storage_key
      - nvirtual_promo_storage_prefix
      - nvirtual_sms_id
      - nvirtual_sms_key
      - nvirtual_sms_sender
      - nvirtual_sms_service
      - nvirtual_storage_bucket
      - nvirtual_talk_channel
      - nvirtual_talk_template
      - nvirtual_talktalk
      - nvirtual_worker_studio_key
    volumes: [fake-sens-state:/var/lib/navis/fake-sens]

  forecast-cron:
    profiles: [forecast]
    build: { <<: *build, target: forecast-cron }
    networks: [workloads]
    depends_on:
      insight: { condition: service_healthy }
      inventory: { condition: service_healthy }
    environment:
      NAVIS_INSIGHT_BASE_URL: http://insight:3000
      NAVIS_INVENTORY_BASE_URL: http://inventory:3000
      NAVIS_FORECAST_INSIGHT_TOKEN_FILE: /run/secrets/forecast_insight_token
      NAVIS_FORECAST_INVENTORY_TOKEN_FILE: /run/secrets/forecast_inventory_token
      NAVIS_FORECAST_STORE_ID: ${NAVIS_FORECAST_STORE_ID:-c05409a6-f082-5964-a787-c1ed3184988b}
      NAVIS_FORECAST_FIXTURE_NOW: ${NAVIS_FORECAST_FIXTURE_NOW:-}
    secrets: [forecast_insight_token, forecast_inventory_token]

  db:
    <<: *postgres
    networks: [data, naver-virtual-data]
    environment: *db-env
    secrets: [db_bootstrap_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - type: bind
        source: ./infra/postgres
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./.secrets/local/db
        target: /run/navis-db
        read_only: true
        bind: { create_host_path: false }

  naver-virtual:
    <<: *node
    build: { <<: *build, target: naver-virtual }
    depends_on:
      db: { condition: service_healthy }
    networks: [naver-virtual-api, naver-virtual-data]
    environment:
      <<: *runtime-db-env
      NAVIS_NAVER_VIRTUAL_CLOCK: ${NAVIS_NAVER_VIRTUAL_CLOCK:-fixed}
      NAVIS_NAVER_VIRTUAL_GRANTS_FILE: /etc/navis/naver-virtual-grants.json
      NAVIS_NAVER_VIRTUAL_REQUIRED_CAPABILITIES:
      NAVIS_NAVER_VIRTUAL_TALKTALK_CALLBACK_URL: http://marketing:3000/internal/v1/naver/talktalk/webhook
      NAVIS_NAVER_VIRTUAL_AICALL_CALLBACK_URL:
    configs:
      - { source: naver_virtual_grants, target: /etc/navis/naver-virtual-grants.json }
    volumes:
      - type: bind
        source: ./.secrets/local/naver-virtual-provider
        target: /run/navis-naver-virtual/provider
        read_only: true
        bind: { create_host_path: false }
    secrets: [nvirtual_run_password, nvirtual_account_token, nvirtual_pos_token, nvirtual_inventory_token,
      nvirtual_customer_token, nvirtual_marketing_token, nvirtual_insight_token, nvirtual_marketing_worker_token, nvirtual_talktalk_marketing_token]

  naver-virtual-tools:
    profiles: [tools]
    build: { <<: *build, target: tools }
    depends_on:
      db: { condition: service_healthy }
    command: [node, --experimental-transform-types, services/naver-virtual/migrate.ts]
    networks: [naver-virtual-data]
    environment:
      <<: *runtime-db-env
      NAVIS_NAVER_VIRTUAL_SEED_INSTANT:
    secrets: [nvirtual_mig_password]

  redis:
    <<: *redis
    networks: [cache]

  relay:
    build: { <<: *build, target: relay }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data, cache]
    environment:
      <<: *runtime-db-env
      NAVIS_REDIS_URL: redis://redis:6379
      NAVIS_PHASE3_FIXTURES: ${NAVIS_PHASE3_FIXTURES:-0}
    secrets: [pos_rly_password, inventory_rly_password, customer_rly_password, marketing_rly_password,
      insight_rly_password, relay_redis_password]

  tools:
    profiles: [tools]
    build: { <<: *build, target: tools }
    networks: [data, test-data]
    environment:
      <<: [*runtime-db-env, *phase3]
      NAVIS_NAVER_VIRTUAL_SEED_INSTANT:
      NAVIS_FIXTURE_CCTV_TOKEN_FILE: /run/secrets/fixture_cctv_token
      NAVIS_INSIGHT_TEST_REDIS_URL: redis://test-redis:6379/1
      NAVIS_PROMO_TEST_REDIS_URL: redis://test-redis:6379/2
      NAVIS_SENS_TEST_REDIS_URL: redis://test-redis:6379/3
      NAVIS_FORECAST_TEST_REDIS_URL: redis://test-redis:6379/4
    secrets: [account_mig_password, inventory_mig_password, pos_mig_password, customer_mig_password,
      marketing_mig_password, insight_mig_password, fixture_cctv_token,
      { source: test_pos_rly_password, target: pos_rly_password },
      { source: test_inventory_rly_password, target: inventory_rly_password },
      { source: test_customer_rly_password, target: customer_rly_password }]
    volumes:
      - type: bind
        source: ./.secrets/test/db
        target: /run/navis-test-db
        read_only: true
        bind: { create_host_path: false }

  test-db: &test-postgres
    <<: *postgres
    profiles: [test]
    networks: [test-data]
    environment: *db-env
    secrets:
      - source: test_db_bootstrap_password
        target: db_bootstrap_password
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - type: bind
        source: ./infra/postgres
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./.secrets/test/db
        target: /run/navis-db
        read_only: true
        bind: { create_host_path: false }

  test-redis:
    profiles: [test]
    image: redis:8.2.9-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [test-data]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  streams-test-db:
    <<: *test-postgres
    profiles: [streams-test]
    networks: [streams-test-data]

  streams-test-redis:
    <<: *redis
    profiles: [streams-test]
    networks: [streams-test-cache]

  streams-tools:
    profiles: [streams-test]
    image: navis-backend-local-tools:latest
    pull_policy: never
    networks: [streams-test-data, streams-test-cache]
    environment:
      NAVIS_DB_HOST: streams-test-db
      NAVIS_REDIS_URL: redis://streams-test-redis:6379
    secrets:
      - { source: test_pos_mig_password, target: pos_mig_password }
      - { source: test_inventory_mig_password, target: inventory_mig_password }
      - { source: test_pos_run_password, target: pos_run_password }
      - { source: test_inventory_run_password, target: inventory_run_password }
      - { source: test_customer_run_password, target: customer_run_password }
      - { source: test_pos_rly_password, target: pos_rly_password }
      - { source: test_inventory_rly_password, target: inventory_rly_password }
      - { source: test_customer_rly_password, target: customer_rly_password }
      - relay_redis_password
      - inventory_redis_password
      - customer_redis_password
      - pos_redis_password

volumes:
  db-data:
    name: navis-backend-local_db-data${NAVIS_LOCAL_VOLUME_SUFFIX:-}
  promo-files:
    name: navis-backend-local_promo-files${NAVIS_LOCAL_VOLUME_SUFFIX:-}
  fake-sens-state:
