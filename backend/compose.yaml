name: navis-backend-local

x-build: &build
  context: ..
  dockerfile: backend/Dockerfile

x-db-env: &db-env
  POSTGRES_USER: navis_bootstrap
  POSTGRES_DB: postgres
  POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256

x-db: &postgres
  image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "navis_bootstrap", "-d", "postgres"]
    interval: 3s
    timeout: 2s
    retries: 15

x-redis: &redis
  image: redis:8.2.9-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
  command: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/run/secrets/redis_acl"]
  secrets: [redis_acl]
  tmpfs: [/data]
  healthcheck:
    test: ["CMD-SHELL", "redis-cli --raw ping | grep -qx PONG"]
    interval: 5s
    timeout: 3s
    retries: 12

x-node: &node
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz', {signal: AbortSignal.timeout(4000)}).then(r => { if (!r.ok) process.exitCode = 1 }, () => { process.exitCode = 1 })"]
    interval: 5s
    timeout: 5s
    retries: 12

x-phase3: &phase3
  NAVIS_PHASE3_FIXTURES: ${NAVIS_PHASE3_FIXTURES:-0}
  NAVIS_FIXTURE_SMS_ENABLED: ${NAVIS_FIXTURE_SMS_ENABLED:-0}

x-provider: &provider
  <<: *node
  depends_on:
    db: { condition: service_healthy }
  environment: &runtime-db-env
    NAVIS_DB_HOST: db
  networks: [workloads, data]

services:
  edge:
    build: { <<: *build, target: edge }
    ports: ["127.0.0.1:18180:80"]
    networks: [loopback, web, api]
    depends_on:
      frontend: { condition: service_healthy, restart: true }
      api-gateway: { condition: service_healthy, restart: true }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/readyz && wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    build:
      <<: *build
      target: frontend
      args:
        VITE_NAVIS_DATA_SOURCE: ${VITE_NAVIS_DATA_SOURCE:-placeholder}
        VITE_NAVIS_CLOCK: ${VITE_NAVIS_CLOCK:-}
        VITE_NAVIS_POS_CLOCK: ${VITE_NAVIS_POS_CLOCK:-}
        VITE_NAVIS_FIXTURE_END_DATE: ${VITE_NAVIS_FIXTURE_END_DATE:-}
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  insight-navis:
    build: { <<: *build, target: insight-navis }
    networks: [navis-api, talktalk-draft-api]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    environment:
      NAVIS_ALLOWED_ORIGINS: ${NAVIS_BROWSER_API_ORIGIN:-http://127.0.0.1:18180}
      NAVIS_TALKTALK_DRAFT_TOKEN_FILE: /run/secrets/talktalk_draft_token
    secrets: [talktalk_draft_token]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz', {signal: AbortSignal.timeout(4000)}).then(r => { if (!r.ok) process.exitCode = 1 }, () => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 5s
      retries: 12

  api-gateway:
    <<: *node
    build: { <<: *build, target: api-gateway }
    networks: [api, workloads, navis-api]
    depends_on:
      account: { condition: service_healthy }
      inventory: { condition: service_healthy }
      pos: { condition: service_healthy }
      insight: { condition: service_healthy }
      marketing: { condition: service_healthy }
    environment:
      <<: *phase3
      NAVIS_ACCOUNT_PUBLIC_ORIGIN: ${NAVIS_BROWSER_API_ORIGIN:-http://127.0.0.1:18180}
      NAVIS_HOSTED_DEMO_AUTH: ${NAVIS_HOSTED_DEMO_AUTH:-0}
      NAVIS_EDGE_DEMO_PROOF_FILE: /run/navis-edge-demo/proof
      NAVIS_INSIGHT_NAVIS_URL: http://insight-navis:8787
      NAVIS_INSIGHT_BASE_URL: http://insight:3000
      NAVIS_MARKETING_BASE_URL: http://marketing:3000
      NAVIS_GATEWAY_INSIGHT_TOKEN_FILE: /run/secrets/gateway_insight_token
      NAVIS_GATEWAY_MARKETING_TOKEN_FILE: /run/secrets/gateway_marketing_token
      NAVIS_GATEWAY_MARKETING_LOCAL_COMMAND_TOKEN_FILE: /run/secrets/gateway_marketing_local_command_token
      NAVIS_GATEWAY_SMS_CONFIRM_TOKEN_FILE: /run/secrets/gateway_sms_confirm_token
      NAVIS_ACCOUNT_URL: http://account:3000
      NAVIS_POS_URL: http://pos:3000
      NAVIS_POS_FIXTURE_NOW: ${NAVIS_POS_FIXTURE_NOW:-}
      NAVIS_INVENTORY_URL: http://inventory:3000
      NAVIS_CUSTOMER_URL: http://customer:3000
      NAVIS_GATEWAY_ACCOUNT_TOKEN_FILE: /run/secrets/gateway_account_token
      NAVIS_GATEWAY_INVENTORY_TOKEN_FILE: /run/secrets/gateway_inventory_token
      NAVIS_GATEWAY_POS_TOKEN_FILE: /run/secrets/gateway_pos_token
      NAVIS_GATEWAY_CUSTOMER_TOKEN_FILE: /run/secrets/gateway_customer_token
    secrets: [gateway_account_token, gateway_inventory_token, gateway_pos_token, gateway_customer_token,
      gateway_insight_token, gateway_marketing_token, gateway_marketing_local_command_token, gateway_sms_confirm_token]

  account:
    <<: *provider
    build: { <<: *build, target: account }
    networks: [workloads, data, naver-virtual-api]
    environment:
      <<: *runtime-db-env
      NAVIS_NAVER_VIRTUAL_ORIGIN: http://naver-virtual:3000
      NAVIS_NAVER_VIRTUAL_TOKEN_FILE: /run/secrets/nvirtual_account_token
      NAVIS_NAVER_VIRTUAL_PROVIDER_CREDENTIALS_DIR: /run/secrets
      NAVIS_BACKEND_DEMO_AUTH: ${NAVIS_BACKEND_DEMO_AUTH:-0}
      NAVIS_HOSTED_DEMO_AUTH: ${NAVIS_HOSTED_DEMO_AUTH:-0}
      NAVIS_ACCOUNT_PUBLIC_ORIGIN: ${NAVIS_BROWSER_API_ORIGIN:-http://127.0.0.1:18180}
      NAVIS_MARKETING_ACCOUNT_TOKEN_FILE: /run/secrets/marketing_account_token
      NAVIS_MARKETING_COMMUNITY_ACCOUNT_TOKEN_FILE: /run/secrets/marketing_community_account_token
      NAVIS_ACCOUNT_COMMUNITY_PAIRS: ${NAVIS_ACCOUNT_COMMUNITY_PAIRS:-[]}
      NAVIS_ACCOUNT_PROMO_STORAGE_DIR: /var/lib/navis/promo
      NAVIS_ACCOUNT_SIGNING_KEY_FILE: /run/secrets/account_signing_key.pem
      NAVIS_GATEWAY_ACCOUNT_TOKEN_FILE: /run/secrets/gateway_account_token
      NAVIS_INVENTORY_ACCOUNT_TOKEN_FILE: /run/secrets/inventory_account_token
      NAVIS_POS_ACCOUNT_TOKEN_FILE: /run/secrets/pos_account_token
      NAVIS_INSIGHT_ACCOUNT_TOKEN_FILE: /run/secrets/insight_account_token
    secrets:
      - account_run_password
      - nvirtual_account_token
      - source: account_signing_key
        target: account_signing_key.pem
      - gateway_account_token
      - marketing_account_token
      - marketing_community_account_token
      - inventory_account_token
      - pos_account_token
      - insight_account_token
      - nvirtual_account_storage_id
      - nvirtual_account_storage_key
      - nvirtual_account_storage_prefix
      - nvirtual_login_id
      - nvirtual_login_secret
      - nvirtual_storage_bucket
    volumes: [promo-files:/var/lib/navis/promo]

  pos:
    <<: *provider
    build: { <<: *build, target: pos }
    networks: [workloads, data, cache, naver-virtual-api]
    environment:
      <<: *runtime-db-env
      NAVIS_NAVER_VIRTUAL_ORIGIN: http://naver-virtual:3000
      NAVIS_NAVER_VIRTUAL_TOKEN_FILE: /run/secrets/nvirtual_pos_token
      NAVIS_NAVER_VIRTUAL_CLOCK: ${NAVIS_NAVER_VIRTUAL_CLOCK:-fixed}
      NAVIS_NAVER_VIRTUAL_ACCOUNT_ID: ansungjalbu-cafe
      NAVIS_NAVER_VIRTUAL_STORE_ID: c05409a6-f082-5964-a787-c1ed3184988b
      NAVIS_NAVER_VIRTUAL_PROVIDER_CREDENTIALS_DIR: /run/secrets
      NAVIS_REDIS_URL: redis://redis:6379
      NAVIS_POS_FIXTURE_NOW: ${NAVIS_POS_FIXTURE_NOW:-}
      NAVIS_GATEWAY_POS_TOKEN_FILE: /run/secrets/gateway_pos_token
      NAVIS_CUSTOMER_POS_TOKEN_FILE: /run/secrets/customer_pos_token
      NAVIS_POS_INVENTORY_URL: http://inventory:3000
      NAVIS_POS_INVENTORY_TOKEN_FILE: /run/secrets/pos_inventory_token
      NAVIS_CUSTOMER_URL: http://customer:3000
      NAVIS_POS_CUSTOMER_TOKEN_FILE: /run/secrets/pos_customer_token
      NAVIS_POS_ACCOUNT_URL: http://account:3000
      NAVIS_POS_ACCOUNT_TOKEN_FILE: /run/secrets/pos_account_token
      NAVIS_INSIGHT_POS_READ_TOKEN_FILE: /run/secrets/insight_pos_read_token
      NAVIS_MARKETING_POS_TOKEN_FILE: /run/secrets/marketing_pos_token
    secrets:
      - pos_run_password
      - insight_pos_read_token
      - marketing_pos_token
      - gateway_pos_token
      - customer_pos_token
      - pos_redis_password
      - pos_inventory_token
      - pos_customer_token
      - pos_account_token
      - nvirtual_pos_token
      - nvirtual_commerce_seller
      - nvirtual_pay_chain
      - nvirtual_pay_id
      - nvirtual_pay_secret
      - nvirtual_pos_commerce_id
